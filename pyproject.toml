[project]
name = "nyc-school-navigator"
version = "0.1.0"
description = "AI-powered NYC school discovery and comparison assistant"
readme = "README.md"
authors = [
    { name = "Niya Zakharova"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.1",
    "langgraph>=1.2.11",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
nyc-school-navigator = "nyc_school_navigator:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
